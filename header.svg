<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131c2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <circle cx="120" cy="60" r="90" fill="#38bdf8" opacity="0.10">
      <animate attributeName="r" values="80;100;80" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.18;0.10" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="220" r="110" fill="#818cf8" opacity="0.10">
      <animate attributeName="r" values="90;120;90" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.16;0.08" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="60" y="120" font-family="Fira Code, monospace" font-size="20" fill="#38bdf8">
    &gt; whoami
  </text>

  <text x="60" y="172" font-family="Fira Code, monospace" font-size="44" font-weight="700" fill="#ffffff">
    Irvan<tspan fill="url(#accent)"> Nandika</tspan>
  </text>

  <text x="60" y="208" font-family="Fira Code, monospace" font-size="17" fill="#94a3b8">
    Full-Stack Developer &bull; Photography SaaS &bull; AI &amp; Blockchain Builder
  </text>

  <text x="60" y="238" font-family="Fira Code, monospace" font-size="13" fill="#475569">
    ~/ylxai [main] $
  </text>

  <text x="415" y="238" font-family="Fira Code, monospace" font-size="13" fill="#38bdf8">
    <tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>▊
    </tspan>
  </text>
</svg>
